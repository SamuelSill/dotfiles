# kitty terminal config.
#
# Why kitty: it implements the kitty keyboard protocol, which encodes chords
# like Ctrl+Alt+j as a distinct sequence instead of collapsing them onto legacy
# control bytes (Ctrl+J == Enter). That's what lets zellij's Ctrl+Alt+j/k scroll
# binds work — Ptyxis/VTE can't send those distinctly. The protocol is ON by
# default in kitty (apps opt in; zellij does), so there's nothing to enable here.
# Do NOT set `allow_hyperlinks no` or disable the keyboard protocol.
#
# zellij auto-starts from ~/.zshrc in every interactive shell, so launching kitty
# drops you straight into zellij.

#: Font ----------------------------------------------------------------------
font_family      Source Code Pro
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0
# If zellij's status-bar arrow separators look wrong, install a Nerd Font
# (e.g. "JetBrainsMono Nerd Font") and set font_family to it.

#: Bell ----------------------------------------------------------------------
enable_audio_bell no

#: Window / session ----------------------------------------------------------
# Don't nag when closing — zellij sessions persist on the server and can be
# reattached with `zellij attach`.
confirm_os_window_close 0
window_padding_width    4

#: Scrollback ----------------------------------------------------------------
# zellij manages its own scrollback inside panes; this only matters for a bare
# (non-zellij) kitty shell.
scrollback_lines 10000

#: Misc ----------------------------------------------------------------------
# Match the clipboard behaviour of the rest of the setup (Wayland wl-copy is
# used by zellij; kitty talks to the Wayland clipboard natively).
copy_on_select no

# Theme: kitty ships a dark default. To pin one, run `kitten themes` and it will
# append an `include current-theme.conf` line here.
